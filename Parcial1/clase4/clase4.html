<!DOCTYPE html>

<body>
    <table>
        <caption>Ola gente, soy la descripción de una tabla</caption>
        <thead>
            <tr>
                <th>Campo para la Clave</th>
                <th>Campo para el Valor</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    Clave:
                </td>
                <td>
                    Valor
                </td>
            </tr>
            <tr>
                <td>
                    Salud:
                </td>
                <td>
                    Buena
                </td>
            </tr>
        </tbody>
    </table>

    <hr>

    <form>
        <label for="nombre">Nombre:</label>
        <input name="nombre" id="nombre" type="text">
        <br><br>
        <label for="correo">Correo:</label>
        <input name="correo" id="correo" type="email">
        <br><br>
        <label for="telefono">Teléfono:</label>
        <input name="telefono" id="telefono" type="tel">
        <br><br>
        <label for="edad">Edad:</label>
        <input name="edad" id="edad" type="number">
        <br><br>
        <label for="nacimiento">Nacimiento:</label>
        <input name="nacimiento" id="nacimiento" type="date">
        <br><br>
        <label for="contraseña">Contraseña:</label>
        <input name="contraseña" id="contraseña" type="password">
        <br><br>
        <label for="codigo">Código:</label>
        <input name="codigo" id="codigo" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}">
    </form>
</body>
